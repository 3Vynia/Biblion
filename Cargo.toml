[workspace]
resolver = "2"
members = ["crates/biblion-core", "crates/biblion-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.41", features = ["bundled"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
unrar = "0.5"
lopdf = { version = "0.47", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
blake3 = "1"
jpeg-decoder = { version = "0.3", default-features = false }
fast_image_resize = "6"
jpeg-encoder = { version = "0.7", features = ["simd"] }
walkdir = "2"
rayon = "1"
crossbeam-channel = "0.5"
clap = { version = "4", features = ["derive", "env"] }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2

# The core does heavy work (parsing, hashing, image resizing): keep it fast in
# development builds too, or scanning a large library in `tauri dev` crawls.
[profile.dev.package.biblion-core]
opt-level = 2
